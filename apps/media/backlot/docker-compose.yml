services:
  app:
    build: .
    container_name: backlot
    ports:
      - "5671:5671"
    env_file:
      - .env
    environment:
      - PORT=5671
      - UI_PORT=5671
    volumes:
      # Mount source for hot-reload during development.
      # ui/ is NOT bind-mounted: extract_to_project writes server.py, index.html,
      # supero-ui.js, and config.js INSIDE /app/ui at container start, which
      # requires write access. The container user (supero, UID 1000) may not
      # own the host's ui/ directory, causing PermissionError. Keep ui/ inside
      # the image. For hot-reloading app.js, uncomment the last line below.
      - ./schemas.py:/app/schemas.py
      - ./setup.py:/app/setup.py
      - ./config.py:/app/config.py
      # - ./ui/app.js:/app/ui/app.js:ro   # opt-in: hot-reload the React app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5671/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
